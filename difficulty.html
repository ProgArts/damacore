<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>انتخاب سختی | داماکور</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Lalezar&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/logo.png">
  
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="mode.css">
  <link rel="stylesheet" href="difficulty.css">
</head>
<body>
  
  <div class="particles" aria-hidden="true">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
  
  <header class="header mode-header">
    <div class="logo-wrapper">
      <img src="assets/logo.png" alt="داماکور" class="logo-img">
      <h1 class="logo-title">داماکور</h1>
    </div>
  </header>
  
  <!-- ─── نمایش داماکوین ─── -->
  <div class="coin-badge">
    <span class="coin-icon">🪙</span>
    <span class="coin-count" id="coinCount">۰</span>
    <span class="coin-label">داماکوین</span>
  </div>
  
  <main class="mode-menu">
    <h2 class="mode-title">سختی بازی رو انتخاب کن</h2>
    
    <div class="difficulty-options">
      
      <!-- 🟢 آسان -->
      <a href="game.html?mode=ai&difficulty=easy" class="mode-card difficulty-card easy">
        <div class="mode-icon">🟢</div>
        <div class="mode-info">
          <h3>آسان</h3>
          <p>برای شروع و یادگیری</p>
          <div class="reward-preview">
            <span>🏆 جایزه برد:</span>
            <span class="reward-amount">+۱۰ 🪙</span>
          </div>
        </div>
        <div class="mode-arrow">←</div>
      </a>
      
      <!-- 🟡 متوسط -->
      <a href="game.html?mode=ai&difficulty=medium" class="mode-card difficulty-card medium">
        <div class="mode-icon">🟡</div>
        <div class="mode-info">
          <h3>متوسط</h3>
          <p>چالش واقعی</p>
          <div class="reward-preview">
            <span>🏆 جایزه برد:</span>
            <span class="reward-amount">+۲۵ 🪙</span>
          </div>
        </div>
        <div class="mode-arrow">←</div>
      </a>
      
      <!-- 🔴 سخت -->
      <a href="game.html?mode=ai&difficulty=hard" class="mode-card difficulty-card hard">
        <div class="mode-icon">🔴</div>
        <div class="mode-info">
          <h3>سخت</h3>
          <p>فقط برای حرفه‌ای‌ها</p>
          <div class="reward-preview">
            <span>🏆 جایزه برد:</span>
            <span class="reward-amount">+۵۰ 🪙</span>
          </div>
        </div>
        <div class="mode-arrow">←</div>
      </a>
      
    </div>
    
    <a href="mode.html" class="btn btn-secondary back-btn">
      <span class="btn-icon">←</span>
      <span>برگشت</span>
    </a>
  </main>
  
  <footer class="footer">
    <p>© ۱۴۰۵ داماکور | ساخته شده توسط پروگ آرت</p>
  </footer>
  
  <script src="storage.js"></script>
  <script>
    // نمایش داماکوین فعلی
    const profile = Storage.getProfile();
    const count = profile.damacoin || 0;
    const persian = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
    document.getElementById('coinCount').textContent = 
      String(count).split('').map(d => persian[d] || d).join('');
  </script>
  
</body>
</html>
